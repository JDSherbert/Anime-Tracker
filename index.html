<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Keep track of the anime you're watching. No ads, no account.">
  <meta name="theme-color" content="#14111c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f3fb" media="(prefers-color-scheme: light)">
  <title>Anime Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <h1><span>Anime</span> Tracker</h1>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
    </button>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Lists"></nav>

  <main id="list" class="list" aria-live="polite"></main>

  <button id="add-btn" class="fab" type="button" aria-label="Add anime">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>

  <!-- Search / add -->
  <dialog id="search-dialog" class="sheet sheet-full" aria-label="Add anime">
    <div class="sheet-inner">
      <div class="search-bar">
        <input id="search-input" type="search" placeholder="Search anime…" autocomplete="off" enterkeyhint="search">
        <button class="btn btn-secondary" type="button" data-close>Close</button>
      </div>
      <div id="results" class="results"></div>
    </div>
  </dialog>

  <!-- Edit an entry -->
  <dialog id="detail-dialog" class="sheet" aria-label="Edit anime">
    <div id="detail-body" class="sheet-inner"></div>
  </dialog>

  <!-- Settings / backup -->
  <dialog id="settings-dialog" class="sheet" aria-label="Settings">
    <div class="sheet-inner">
      <h2 class="sheet-title">Settings</h2>
      <p class="muted">Your list is saved on this phone only. Export a backup now and then, especially before changing phones or clearing browser data.</p>
      <p id="storage-status" class="muted small"></p>
      <div class="stack">
        <button id="export-btn" class="btn" type="button">Export backup</button>
        <label class="btn btn-secondary file-btn">
          Import backup
          <input id="import-input" type="file" accept="application/json,.json" hidden>
        </label>
      </div>
      <p class="muted small">Anime info and cover art from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>.</p>
      <button class="btn btn-secondary" type="button" data-close>Done</button>
    </div>
  </dialog>

  <div id="toast" class="toast" popover="manual" role="status"></div>
</body>
</html>
